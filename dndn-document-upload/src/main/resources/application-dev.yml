server:
  port: 20000

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5.5

spring:
  application:
    name: dndn

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        format_sql: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.example: debug
    org.example.dndncore.worker.scheduler: debug
    net.ttddyy.observation: DEBUG

weather:
  kma:
    service-key: ${KMA_SERVICE_KEY}
    village-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst
    mid-land-url: http://apis.data.go.kr/1360000/MidFcstInfoService/getMidLandFcst
    mid-temp-url: http://apis.data.go.kr/1360000/MidFcstInfoService/getMidTa
    warning-url: http://apis.data.go.kr/1360000/WthrWrnInfoService/getWthrWrnMsg
    asos-url: http://apis.data.go.kr/1360000/AsosDalyInfoService/getWthrDataList
    nx: 60
    ny: 127
    mid-land-reg-id: 11B00000
    mid-temp-reg-id: 11B10101
    stn-id: 108
    location-label: 서울 현장

  air-korea:
    service-key: ${AIRKOREA_SERVICE_KEY}
    sido-url: http://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty
    sido-name: 서울

  scheduler:
    enabled: true
    cron: "0 0 * * * *"
    warmup-on-startup: true
    startup-past-days: 15
    startup-future-days: 15
    refresh-future-days: 15

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}



cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region: ap-northeast-2
    s3:
      bucket: ${AWS_BUCKET_NAME}
      presigned-url-expiration: 600


worker:
  sync:
    scheduler:
      enabled: true
      cron: "0 30 0 * * *"   # 매일 오전 00:30

storage:
  type: s3   # 기본값: s3 (운영). 부하테스트할 때만 local로 변경
  local:
    base-url: http://localhost:8080   # 로컬 다운로드 엔드포인트의 base URL

file:
  upload-dir: ./uploads

jmj:
  json: ${KAFKA_JSON}