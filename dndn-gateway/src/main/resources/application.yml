server:
  port: ${GATEWAY_PORT:8088}

spring:
  application:
    name: dndn-gateway

gateway:
  routes:
    document-management-uri: ${DOCUMENT_MANAGEMENT_SERVICE_URI:lb://DNDN-DOCUMENT-MANAGEMENT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
