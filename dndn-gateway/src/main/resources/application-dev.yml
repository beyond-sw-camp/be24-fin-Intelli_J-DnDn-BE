server:
  port: ${GATEWAY_PORT:8088}

spring:
  application:
    name: dndn-gateway

gateway:
  routes:
    core-uri: ${CORE_SERVICE_URI:http://localhost:8080}
    document-management-uri: ${DOCUMENT_MANAGEMENT_SERVICE_URI:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: info
    org.example: info
